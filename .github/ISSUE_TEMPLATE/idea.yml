name: Idea
description: Something junban could do better
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What gets in your way
      description: The situation, not the solution. How many agents, what you were trying to do, where time goes.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Optional. A key, a badge, an option, anything.
